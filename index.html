    <script>
      /* Universal cycle-safe JSON.stringify patch to prevent circular structure errors */
      (function() {
        var nativeStringify = JSON.stringify;
        function cycleSafeReplacer(replacer) {
          var seen = new WeakSet();
          return function(key, val) {
            if (typeof val === 'object' && val !== null) {
              if (
                seen.has(val) ||
                (typeof Node !== 'undefined' && val instanceof Node) ||
                (typeof Window !== 'undefined' && val instanceof Window) ||
                (typeof Document !== 'undefined' && val instanceof Document)
              ) {
                return undefined;
              }
              try {
                seen.add(val);
              } catch (_) {}
            }
            if (typeof replacer === 'function') {
              return replacer.call(this, key, val);
            }
            return val;
          };
        }

        function safeStringify(value, replacer, space) {
          try {
            var rep = cycleSafeReplacer(replacer);
            return nativeStringify.call(JSON, value, rep, space);
          } catch (err) {
            try {
              if (typeof value === 'object' && value !== null) {
                var simple = {};
                for (var k in value) {
                  try {
                    if (typeof value[k] !== 'object' && typeof value[k] !== 'function') {
                      simple[k] = value[k];
                    }
                  } catch (_) {}
                }
                return nativeStringify.call(JSON, simple, null, space);
              }
              return nativeStringify.call(JSON, String(value));
            } catch (_) {
              return '"{}"';
            }
          }
        }

        try {
          window.JSON.stringify = safeStringify;
          JSON.stringify = safeStringify;
        } catch (_) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('Converting circular structure to JSON') !== -1) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
